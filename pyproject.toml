[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-behavior-assessment-layer"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
    "pytest",
    "requests",
    "python-dotenv",
]

[tool.setuptools]
py-modules = ["groq_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
